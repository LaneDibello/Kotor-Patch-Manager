# ShowWindow_Win32. The engine calls this with SW_MINIMIZE when the window loses the display and with
# SW_SHOWNORMAL once the renderer is ready; the original body honours neither, calling SDL_RaiseWindow
# for a subset of commands that excludes SW_MINIMIZE entirely. The hook adds the two actions and then
# lets the original run. Six bytes covers the whole prologue, leaving hwnd and nCmdShow where the
# caller put them.
[[hooks]]
address = 0x080E9C74
function = "ShowWindowHonoursCommand"
original_bytes = [0x53, 0x57, 0x56, 0x83, 0xEC, 0x10]
type = "detour"
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

# The shim's SDL event pump at 0x080C1658, just after SDL_PeepEvents has returned an event and before it
# is dispatched. ESI holds the event for the whole loop. The stolen instruction is an absolute load, so
# replaying it is safe.
[[hooks]]
address = 0x080C16B5
function = "ToggleFullscreenOnAltEnter"
original_bytes = [0xA1, 0x0C, 0x11, 0x8F, 0x08]
type = "detour"
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

# CClientExoAppInternal::StartServices' call to ApplyVideoMode, the one unconditional duplicate of the
# three startup applies. skip_original_bytes drops the call so the hook decides whether it happens; a
# five-byte call takes a five-byte relative jump exactly. ApplyVideoMode returns void and no caller reads
# a result, so nothing needs producing when it is skipped.
[[hooks]]
address = 0x081AC65C
function = "SkipDuplicateVideoModeApply"
original_bytes = [0xE8, 0xA4, 0xDB, 0xFE, 0xFF]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

# CClientExoAppInternal::SetVideoMode's call. This apply must run, and does: the hook reissues it and
# records its arguments, which is how the StartServices hook recognises a duplicate.
#
# skip_original_bytes is set even though the call is wanted, because the patcher copies stolen bytes into
# its stub verbatim with no displacement fixup. A relative call relocated that way resolves against the
# stub and jumps nowhere, so it has to be reissued from the hook instead of replayed.
#
# WinMain's two call sites are deliberately absent. They drain g_nVideoModeChangePending, so skipping
# them leaves the request set and hangs the main loop.
[[hooks]]
address = 0x081AEB7C
function = "RunAndRecordVideoModeApply"
original_bytes = [0xE8, 0x84, 0xB6, 0xFE, 0xFF]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"
