[[hooks]]
address = 0x080EA7C1
function = "CreationFlagsMatchTheFinalWindow"
original_bytes = [0xC7, 0x44, 0x24, 0x14, 0x02, 0x00, 0x00, 0x00]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
