[[hooks]]
address = 0x080EE406
function = "ReportStretchVariant"
original_bytes = [0xC7, 0x46, 0x38, 0x00, 0x00, 0x00, 0x00]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

# CSWGuiOptionsResolution's constructor, immediately after the CExoString::Format at 0x082DFAC8 that
# composes a resolution list entry and before the text reaches the control. esp+0 is the argument
# list that call left on the stack, holding the composed string and the mode's numbers.
[[hooks]]
address = 0x082DFACD
function = "MarkScaledResolutions"
original_bytes = [0x8D, 0x87, 0x78, 0x01, 0x00, 0x00]
type = "detour"
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

# ESI carries the mode index through the loop. It is stored into the entry at 0x082DFAE3 and is not
# written anywhere in this branch, so it still names the mode here. Its low bit says whether this is
# the stretched reading of that mode.
[[hooks.parameters]]
source = "esi"
type = "int"

# The four instructions in CreateWindowEx_Shared that copy ASL__Display__GetLogicalMode's answer into
# the width and height passed to ASL__SDL__CreateWindow, reached only when the caller asked for
# CW_USEDEFAULT. skip_original_bytes drops all four so the hook decides the size; execution resumes at
# 0x080EA775, and the GetLogicalMode call before them still runs, leaving its SDL_Rect readable as the
# fallback.
[[hooks]]
address = 0x080EA75F
function = "DefaultSizeMatchesTheFinalWindow"
original_bytes = [0x8B, 0x84, 0x24, 0x40, 0x01, 0x00, 0x00, 0x89, 0x44, 0x24, 0x28,
                  0x8B, 0x84, 0x24, 0x44, 0x01, 0x00, 0x00, 0x89, 0x44, 0x24, 0x2C]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

# The SDL flags staged for ASL__SDL__CreateWindow inside CreateWindowEx_Shared, the last store before
