# KOTOR2 GOG Aspyr dynamic-light patch, 3 lights -> 7.
# Addresses are VA-style. No manifest conflicts.
#
# Effect:
#   - LightManager/scene caps: 3 -> 7
#   - light block moved to env[96..140], so skinned programs take 7 lights too
#   - per-program count reduced where the assembled program would not fit
#   - generated VP source allocation: 0x1000 -> 0x4000
#
# Lights take five env registers each counting down from env[87] and the bone palette
# sits at env[18..68], so the fourth light clips it. Capping skinned programs at 3 used
# to leave a character's dangly hair on the full count and its face on 3, because hair
# draws as a plain trimesh through a program with no palette. Nothing in either build
# references above env[92], so the block moves rather than the count dropping. Where the
# driver has no room for that, or where the assembled program would overrun the
# 8196-byte buffer it is built in, the count falls back: see MaxLights.cpp.
#
# The count is 7 because the LightManager enables units as GL_LIGHT0 + index + 1, leaving
# GL_LIGHT1..GL_LIGHT7 usable. GL_MAX_LIGHTS is implementation-dependent with a spec floor
# of 8 and implementations sit on that floor, so 7 is the ceiling short of rebasing 18
# immediates per build onto GL_LIGHT0.

# LightManager::maxLights global
[[hooks]]
address = 0x00A0FB64
type = "simple"
original_bytes = [0x03, 0x00, 0x00, 0x00]
replacement_bytes = [0x07, 0x00, 0x00, 0x00]

# LightManager::PrioritizeIllumination loop cap
[[hooks]]
address = 0x009006DC
type = "simple"
original_bytes = [0x83, 0x7D, 0xF0, 0x03]
replacement_bytes = [0x83, 0x7D, 0xF0, 0x07]

# Scene::DoGobBuckets count #1
[[hooks]]
