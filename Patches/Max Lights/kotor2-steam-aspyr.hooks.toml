# VertexProgram generated-source allocation
[[hooks]]
address = 0x005067FA
type = "simple"
original_bytes = [0x68, 0x00, 0x10, 0x00, 0x00]
replacement_bytes = [0x68, 0x00, 0x40, 0x00, 0x00]

# VertexProgram::VertexProgram light count.
# Replaces stock: mov dword ptr [this + 0x2010], 3
[[hooks]]
address = 0x00506599
function = "SetProgramLightCount"
original_bytes = [0xC7, 0x80, 0x10, 0x20, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# LightManager::SetupVertexProgramLights, past the preamble and before the
# per-light loop, where the cursor has reached env[87].
[[hooks]]
address = 0x0050BAF0
function = "RelocateLightBlock"
original_bytes = [0xC7, 0x45, 0xC4, 0x00, 0x00, 0x00, 0x00]
type = "detour"
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# LightManager::SetUpVertexProgramLightShaderConstants, before the branch that
# picks between the two light layouts, so one hook covers both.
[[hooks]]
address = 0x0050B0A6
function = "RelocateLightBlock"
original_bytes = [0x0F, 0xBF, 0x15, 0xF0, 0x5E, 0x9F, 0x00]
type = "detour"
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"
