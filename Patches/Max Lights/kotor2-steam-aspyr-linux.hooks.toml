# KOTOR2 Steam Aspyr native Linux dynamic-light patch, 3 lights -> 7.
#
# Same effect as the Windows hook sets, but Clang compiled the light setup differently.
# The register cursor MSVC kept in a stack slot was folded to immediates here, so the block
# moves by patching those directly rather than through the detours Windows needs, and the
# env[82] shifted mode is a separate specialised path with three bases of its own.
#
# See kotor2-gog-aspyr.hooks.toml for why the block moves and why the count is 7.

# LightManager::maxLights global
[[hooks]]
address = 0x088E8EB0
type = "simple"
original_bytes = [0x03, 0x00, 0x00, 0x00]
replacement_bytes = [0x07, 0x00, 0x00, 0x00]

# LightManager::PrioritizeIllumination loop cap
[[hooks]]
address = 0x084232E3
type = "simple"
original_bytes = [0x83, 0xFA, 0x03]
replacement_bytes = [0x83, 0xFA, 0x07]

# LightManager::EnableHighestPriorityLights guard. Clang holds the count in
# one's complement here, so ~count <= -4 means count >= 3; seven needs -8.
[[hooks]]
address = 0x084234CD
type = "simple"
original_bytes = [0x83, 0x7C, 0x24, 0x1C, 0xFC]
replacement_bytes = [0x83, 0x7C, 0x24, 0x1C, 0xF8]

# LightManager::EnableHighestPriorityLights disable-sweep terminator,
# GL_LIGHT0 + 1 + cap
[[hooks]]
address = 0x084234E3
type = "simple"
original_bytes = [0x81, 0xFE, 0x04, 0x40, 0x00, 0x00]
replacement_bytes = [0x81, 0xFE, 0x08, 0x40, 0x00, 0x00]

# LightManager::EnableHighestPriorityLightsFade guard
[[hooks]]
address = 0x08423990
type = "simple"
original_bytes = [0x83, 0xFD, 0x03]
replacement_bytes = [0x83, 0xFD, 0x07]

