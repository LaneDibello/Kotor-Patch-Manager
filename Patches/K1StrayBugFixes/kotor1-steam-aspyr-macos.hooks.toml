# ==============================================================================
# 1. WORD-WRAP INFINITE LOOP HANG ("INVENTORY CRASH") (K1)
# ==============================================================================
# Function: CAurGUIStringInternal::WrapStrings (0x1001bc644)
# A line with no space to break on that cannot fit even two characters backs its
# cursor up one character and restarts. The no-progress guard compares against
# the start of the whole STRING instead of the current LINE, so the line restarts
# where it began forever, appending a line entry each pass until allocation fails.
# (Stack counts are bare numbers in a narrow label: enlarged fonts hit this.)
#
# Fix: test progress against the line start (r15). With no progress, take the rest
# of the line whole and hand it to the engine's own end-of-line path (0x1001bca69),
# which appends it and moves on. Unfittable text degrades to one overflowing line.
[[hooks]]
address = 0x1001bc7ec
type = "replace"
original_bytes = [0x49, 0xFF, 0xC8, 0x4C, 0x8B, 0x65, 0xB0, 0x4D, 0x3B, 0x44, 0x24, 0x18, 0x0F, 0x84, 0xF8, 0x02, 0x00, 0x00]
replacement_bytes = [0x49, 0xFF, 0xC8, 0x4C, 0x8B, 0x65, 0xB0, 0x4D, 0x39, 0xF8, 0x77, 0x25, 0x4D, 0x89, 0xF8, 0x41, 0x0F, 0xB6, 0x00, 0x84, 0xC0, 0x74, 0x09, 0x3C, 0x0A, 0x74, 0x05, 0x49, 0xFF, 0xC0, 0xEB, 0xEF, 0x41, 0x88, 0xC5, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x69, 0xCA, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

# Two guards before the loop blank strings of one or two characters outright when
# the box is narrower than one or two 'o' glyphs, so enlarged stack counts vanish.
# Removing them is only safe together with the fix above (a box too narrow for one
# character used to hang; it now draws one overflowing line). A set: never alone.
#   0x1001bc71e  strlen == 1 and width < w('o')   : jmp return -> jmp to the loop
[[hooks]]
address = 0x1001bc71e
type = "simple"
original_bytes = [0xE9, 0xC4, 0x03, 0x00, 0x00]
replacement_bytes = [0xEB, 0x1E, 0x90, 0x90, 0x90]

#   0x1001bc738  strlen <= 2 and width < 2*w('o') : jl return -> fall through
[[hooks]]
address = 0x1001bc738
type = "simple"
original_bytes = [0x0F, 0x8C, 0xA9, 0x03, 0x00, 0x00]
replacement_bytes = [0x90, 0x90, 0x90, 0x90, 0x90, 0x90]

# ==============================================================================
# 2. LISTBOX ROW HEIGHT INFLATION ON REPOPULATE (K2)
# ==============================================================================
# Function: CSWGuiListBox::OrganizeControls (0x1004a82b4)
# The visible-row loop spreads the box's leftover height over the rows by making
# each row taller (rowHeight + leftover/rows, +1px on the remainder rows) and
# writes that height into the reused row controls. The next pass recomputes the
# list's item height (+0x368) as the max row height, reads the inflated value back
# and inflates again: lists grow each time they are refilled.
#
# Fix: keep the rect height at the item height stored before the loop ([rbp-0x34]);
# row positions still spread exactly as before (they advance by ebx, untouched).
#   0x1004a8927  mov [rbp-0x34], ebx   (rowHeight + extra)
[[hooks]]
address = 0x1004a8927
type = "simple"
original_bytes = [0x89, 0x5D, 0xCC]
replacement_bytes = [0x90, 0x90, 0x90]

#   0x1004a8939  mov [rbp-0x34], eax   (rowHeight + extra + 1, remainder rows)
[[hooks]]
address = 0x1004a8939
type = "simple"
original_bytes = [0x89, 0x45, 0xCC]
replacement_bytes = [0x90, 0x90, 0x90]

# ==============================================================================
# 3. SINGLE LINE TALLER THAN BOX VANISHING (K5)
# ==============================================================================
# Function: CAurGUIStringInternal::Draw (0x1001bcb04)
# When a text's lines do not fit its box, Draw drops lines from the top until the
# rest fits (bottom-aligned 0x20 and centred 0x10 alignment). A single line taller
# than its box is therefore dropped entirely and nothing is drawn: stack counts
# disappear as soon as the font outgrows the badge (FontScale, HD fonts, font mods).
# Fix: never drop the last line. Text that partly fits behaves exactly as before;
# text that cannot fit even one line is drawn overflowing instead of vanishing.
# [r13+0x50] = line count, r12 = lines dropped so far (first line to draw).
#   bottom-aligned entry: single line -> keep it (0x1001bcc2a), else drop loop
[[hooks]]
address = 0x1001bcbef
type = "replace"
original_bytes = [0x0F, 0x2E, 0xCA, 0x76, 0x36]
replacement_bytes = [0x0F, 0x2E, 0xCA, 0x76, 0x09, 0x41, 0x83, 0x7D, 0x50, 0x01, 0x7E, 0x02, 0xEB, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x2A, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   bottom-aligned loop: stop once only one line would remain
[[hooks]]
address = 0x1001bcc22
type = "replace"
original_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xCA, 0x77, 0xD1]
replacement_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xCA, 0x76, 0x19, 0x41, 0x8B, 0x4D, 0x50, 0xFF, 0xC9, 0x41, 0x39, 0xCC, 0x7D, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0xFB, 0xCB, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   centred entry: single line -> keep it (0x1001bccb1), else drop loop
[[hooks]]
address = 0x1001bcc72
type = "replace"
original_bytes = [0x0F, 0x2E, 0xD1, 0x76, 0x3A]
replacement_bytes = [0x0F, 0x2E, 0xD1, 0x76, 0x09, 0x41, 0x83, 0x7D, 0x50, 0x01, 0x7E, 0x02, 0xEB, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0xB1, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   centred loop: stop once only one line would remain
[[hooks]]
address = 0x1001bcca9
type = "replace"
original_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xD1, 0x77, 0xD1]
replacement_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xD1, 0x76, 0x19, 0x41, 0x8B, 0x4D, 0x50, 0xFF, 0xC9, 0x41, 0x39, 0xCC, 0x7D, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x82, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

# ==============================================================================
# 4. WRAPPED TEXT MEASUREMENT UNDER-ESTIMATION (K6)
# ==============================================================================
# Function: CAurGUIStringInternal::WrapStrings
# The line-breaker truncates every glyph advance to whole pixels after adding
# 0.25, so it under-measures a line by ~0.25px per character on average while
# Draw advances by the exact float widths: long lines can end up wider than the
# box they were wrapped for and run into the scrollbar. KMRP's Windows fix adds a
# 0.5px wrap margin (unbiased rounding); here the one accumulation in the loop is
# pointed at the engine's existing 0.5f (0x100537dc4) instead of 0.25f
# (0x10056eca0, shared by 42 other instructions, so the constant stays).
#   addss xmm0, [rip+disp] : 0x10056eca0 -> 0x100537dc4
[[hooks]]
address = 0x1001bca20
type = "simple"
original_bytes = [0xF3, 0x0F, 0x58, 0x05, 0x78, 0x22, 0x3B, 0x00]
replacement_bytes = [0xF3, 0x0F, 0x58, 0x05, 0x9C, 0xB3, 0x37, 0x00]

# ==============================================================================
# 5. TEXTURE BUCKET ARRAY BOUNDS & MAXIMUM SAFETY
# ==============================================================================
# The engine manages texture buckets using three 5000-entry internal arrays indexed
# by raw OpenGL texture IDs. Texture IDs >= 5000 index past the end of the arrays,
# causing memory corruption. Two cooperating safety hooks prevent out-of-bounds
# indexing and unsafe loop bounds:
#
# 5.1 Texture Insertion Bounds Guard
# Function: Texture bucket insertion callsite (0x1001d0663)
# Accepts unsigned texture IDs 0..4999 and executes normal index calculation
# (cltq; shl rax, 4). Any texture ID >= 5000 bypasses the bucket insertion call
# and transfers directly to 0x1001d067b (the native shadow path continuation),
# keeping the stack balanced and preserving RAX.
[[hooks]]
address = 0x1001d0663
type = "replace"
original_bytes = [0x48, 0x98, 0x48, 0xc1, 0xe0, 0x04]
replacement_bytes = [0x3d, 0x88, 0x13, 0x00, 0x00, 0x72, 0x10, 0x50, 0x48, 0xb8, 0x7b, 0x06, 0x1d, 0x00, 0x01, 0x00, 0x00, 0x00, 0x48, 0x87, 0x04, 0x24, 0xc3, 0x48, 0x98, 0x48, 0xc1, 0xe0, 0x04]

# 5.2 Texture Maximum ID Clamp
# Function: GetMaxTextureID (0x1001fa2bb)
# In the all-textures builder path, the engine sets the maximum texture ID without
# range validation, which the bucket-clearing loop then uses. This hook intercepts
# the global read from 0x100635ba8 at 0x1001fa2bf and caps the returned maximum ID
# at 4999 (preserving RFLAGS), preventing buffer overrun during bucket clearing.
[[hooks]]
address = 0x1001fa2bf
type = "replace"
original_bytes = [0x8b, 0x05, 0xe3, 0xb8, 0x43, 0x00]
replacement_bytes = [0x9c, 0x48, 0xb8, 0xa8, 0x5b, 0x63, 0x00, 0x01, 0x00, 0x00, 0x00, 0x8b, 0x00, 0x3d, 0x88, 0x13, 0x00, 0x00, 0x72, 0x05, 0xb8, 0x87, 0x13, 0x00, 0x00, 0x9d]

# ==============================================================================
# 6. GRASS BUFFER CLEANUP DOUBLE-FREE SAFETY
# ==============================================================================
# In the engine's grass rendering system, +0x38 is the primary polygon buffer and
# +0x40 is a temporary alias pointer. During normal cleanup, the temporary alias
# is cleared. However, when an allocation fails or early exit occurs, both the
# grass destructor and DestroyGrassPolys attempt to delete the temporary pointer
# and then the primary pointer even when both point to the same memory allocation,
# causing a heap double-free crash.
#
# The hooks compare the temporary pointer in [rbx+0x40] against the primary pointer
# in [rbx+0x38]. If they match, %rdi is zeroed so the native 'je' skips the duplicate
# delete. If the pointers differ, the temporary allocation is freed normally.
#
# 6.1 Grass Destructor Temporary Alias Check
# Function: Grass destructor cleanup loop (0x1001e00cd)
[[hooks]]
address = 0x1001e00cd
type = "replace"
original_bytes = [0x48, 0x8b, 0x7b, 0x40, 0x48, 0x85, 0xff]
replacement_bytes = [0x48, 0x8b, 0x7b, 0x40, 0x48, 0x3b, 0x7b, 0x38, 0x75, 0x02, 0x31, 0xff, 0x48, 0x85, 0xff]

# 6.2 DestroyGrassPolys Temporary Alias Check
# Function: DestroyGrassPolys cleanup loop (0x1001e1627)
[[hooks]]
address = 0x1001e1627
type = "replace"
original_bytes = [0x48, 0x8b, 0x7b, 0x40, 0x48, 0x85, 0xff]
replacement_bytes = [0x48, 0x8b, 0x7b, 0x40, 0x48, 0x3b, 0x7b, 0x38, 0x75, 0x02, 0x31, 0xff, 0x48, 0x85, 0xff]

# ==============================================================================
# 7. SCRIPTS MENU ENTER KEY BUG (K7)
# ==============================================================================
# Function: Script list row activation/double-click callback (0x1002d3e34)
# When the AI Scripts menu opens, Tutorial Box 10 ("Combat Scripts") appears.
# In vanilla, each script entry row in the listbox registers a button callback
# (0x1002d3e34) for event 0x27 (which BioWare shared between the keyboard Enter
# keypress and listbox row double-click activation). When Enter is pressed to
# dismiss the tutorial popup, this row callback hijacked the Enter keypress,
# popping the modal panel and setting the 0x200 closing flag on ScriptSelect.
#
# Fix: Check the call stack origin. When called by a genuine mouse double-click:
# - (%rsp) == 0x1004a9221 (CSWGuiListBox::HandleInputEvent forwarder)
# - 8(%rbp) == 0x1004aa8b1 (CSWGuiListBox::OnMouseClick double-click callsite)
# When called from a keyboard Enter keypress, 8(%rbp) does not match 0x1004aa8b1.
# - If called from mouse double-click: executes the native prologue and jumps to
#   0x1002d3e3e, confirming the selection and auto-closing the menu.
# - If called from keyboard Enter: returns immediately (retq), allowing Enter to
#   dismiss the tutorial popup cleanly on the first press without closing the menu.
[[hooks]]
address = 0x1002d3e34
type = "replace"
original_bytes = [0x55, 0x48, 0x89, 0xE5, 0x41, 0x56, 0x53, 0x48, 0x89, 0xFB]
replacement_bytes = [
    0x48, 0xB8, 0x21, 0x92, 0x4A, 0x00, 0x01, 0x00, 0x00, 0x00,
    0x48, 0x39, 0x04, 0x24,
    0x75, 0x28,
    0x48, 0xB8, 0xB1, 0xA8, 0x4A, 0x00, 0x01, 0x00, 0x00, 0x00,
    0x48, 0x39, 0x45, 0x08,
    0x75, 0x18,
    0x55,
    0x48, 0x89, 0xE5,
    0x41, 0x56,
    0x53,
    0x48, 0x89, 0xFB,
    0xFF, 0x25, 0x00, 0x00, 0x00, 0x00,
    0x3E, 0x3E, 0x2D, 0x00, 0x01, 0x00, 0x00, 0x00,
    0xC3
]

# ==============================================================================
# 8. MODULE KEY TABLE DESTRUCTION USE-AFTER-FREE SAFETY
# ==============================================================================
# Functions: CExoKeyTable::DestroyTable (0x10035be6e), CExoKeyTable::RebuildTable (0x10035c300)
# When unloading a module (.mod/.rim/.sav), DestroyTable iterates over all entries
# in the dying CExoKeyTable before ~CExoKeyTable frees the m_pEntries array.
# When a resource has no fallback in another key table and is not in demand
# (m_nDemands == 0), the engine detaches the CRes object from the dying table by
# clearing m_pRes->m_pKeyEntry (+0x20) = NULL and m_pRes->m_nID (+0x0c) = 0xFFFFFFFF.
# However, if the resource is still in demand during table deletion (m_nDemands > 0),
# both DestroyTable and RebuildTable set flag 0x200 on m_pRes->m_status (+0x10)
# and forget to clear m_pRes->m_pKeyEntry and m_pRes->m_nID. Once ~CExoKeyTable
# frees m_pEntries, m_pRes->m_pKeyEntry becomes a dangling pointer into the freed
# heap block. When CExoResMan::ReleaseResObject (0x10036aa8a) later releases the
# resource, it writes 8 zero bytes to m_pKeyEntry->m_pRes (+0x10), corrupting
# macOS's small malloc free-list checksums and triggering a SIGABRT crash on
# module transitions.
#
# Fix: Clear m_pRes->m_pKeyEntry (+0x20) = NULL and m_pRes->m_nID (+0x0c) = 0xFFFFFFFF
# alongside setting the 0x200 status flag in both DestroyTable and RebuildTable.
#
# 8.1 CExoKeyTable::DestroyTable In-Demand Resource Detach (0x10035bf7a)
# Replaces the dead sprintf debug formatting block in-place (23 bytes):
#   orb $0x2, 0x11(%rdi); movq $0x0, 0x20(%rdi); movl $0xffffffff, 0xc(%rdi); jmp 0x10035bfff
[[hooks]]
address = 0x10035bf7a
type = "simple"
original_bytes = [0x4C, 0x89, 0xF7, 0xE8, 0xBE, 0x0C, 0xFF, 0xFF, 0x48, 0x8B, 0x7B, 0x10, 0x4C, 0x01, 0xEF, 0x4C, 0x89, 0xF6, 0xE8, 0xAF, 0xBC, 0x00, 0x00]
replacement_bytes = [0x80, 0x4F, 0x11, 0x02, 0x48, 0xC7, 0x47, 0x20, 0x00, 0x00, 0x00, 0x00, 0xC7, 0x47, 0x0C, 0xFF, 0xFF, 0xFF, 0xFF, 0xEB, 0x70, 0x90, 0x90]

# 8.2 CExoKeyTable::RebuildTable In-Demand Resource Detach (0x10035c434)
[[hooks]]
address = 0x10035c434
type = "replace"
original_bytes = [0x80, 0x4F, 0x11, 0x02, 0xE9, 0x91, 0x00, 0x00, 0x00]
replacement_bytes = [
    0x80, 0x4F, 0x11, 0x02,
    0x48, 0xC7, 0x47, 0x20, 0x00, 0x00, 0x00, 0x00,
    0xC7, 0x47, 0x0C, 0xFF, 0xFF, 0xFF, 0xFF,
    0xFF, 0x25, 0x00, 0x00, 0x00, 0x00,
    0xCE, 0xC4, 0x35, 0x00, 0x01, 0x00, 0x00, 0x00
]

# ==============================================================================
# 9. FIRST-PERSON CAMERA TOGGLE NULL PARTY LEADER SAFETY (CAPS LOCK CRASH)
# ==============================================================================
# Function: CClientGui::HandleKeyEvent (0x1002fa0a1)
# Pressing Caps Lock to toggle First-Person Look Mode (0x1002faf82) calls
# CSWPartyTable::GetPartyLeader() (0x1002a70ae) and immediately dereferences
# 0x8(%rax) at 0x1002faf87 without a NULL check. If the client party table is
# empty (for example, during scripted sequences or after UT_ClearAllPartyMembers
# when no party leader is active), GetPartyLeader() returns NULL and pressing
# Caps Lock causes an immediate EXC_BAD_ACCESS crash.
#
# 9.1 First-Person Camera Toggle NULL Party Leader Guard (0x1002faf87)
# Guards against CSWPartyTable::GetPartyLeader() (0x1002a70ae) returning NULL when
# Caps Lock is pressed while the client party table is empty, jumping cleanly to
# the function epilogue (0x1002fadee) instead of dereferencing 0x8(%rax).
[[hooks]]
address = 0x1002faf87
type = "replace"
original_bytes = [0x48, 0x8B, 0x70, 0x08, 0x4C, 0x89, 0xF7]
replacement_bytes = [
    0x48, 0x85, 0xC0,
    0x74, 0x09,
    0x48, 0x8B, 0x70, 0x08,
    0x4C, 0x89, 0xF7,
    0xEB, 0x0E,
    0xFF, 0x25, 0x00, 0x00, 0x00, 0x00,
    0xEE, 0xAD, 0x2F, 0x00, 0x01, 0x00, 0x00, 0x00
]

# ==============================================================================
# 10. LEADING NEWLINE TRIM IN GUI TEXT (K3)
# ==============================================================================
# Function: CSWGuiTextParams::SetText (0x1004a3714)
# Descriptions that open with a property block start with "\n" and render an
# empty first line. Trimmed in place right after the setter's string assignment,
# so wrapping and drawing see the same text. Cut: mov eax, -1 (5 bytes).
# (Placed at the end of the file so all static/replace byte hooks verify first).
[[hooks]]
address = 0x1004a3726
type = "detour"
function = "KMRP_TrimLeadingNewlines"
original_bytes = [0xB8, 0xFF, 0xFF, 0xFF, 0xFF]
[[hooks.parameters]]
source = "rbx"
type = "pointer"
