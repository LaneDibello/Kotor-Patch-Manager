# ==============================================================================
# KMRP ENGINE FIXES
# ==============================================================================
# Vanilla engine bugs fixed the way KMRP fixes them in the Windows swkotor.exe.
# Independent of the widescreen layout above. Full write-up: KMRP-ENGINE-FIXES.md

# ------------------------------------------------------------------------------
# K1. Word-wrap hang ("inventory crash") - CAurGUIStringInternal::WrapStrings (0x1001bc644)
# ------------------------------------------------------------------------------
# A line with no space to break on that cannot fit even two characters backs its
# cursor up one character and restarts. The no-progress guard compares against
# the start of the whole STRING instead of the current LINE, so the line restarts
# where it began forever, appending a line entry each pass until allocation fails.
# (Stack counts are bare numbers in a narrow label: enlarged fonts hit this.)
#
# Fix: test progress against the line start (r15). With no progress, take the rest
# of the line whole and hand it to the engine's own end-of-line path (0x1001bca69),
# which appends it and moves on. Unfittable text degrades to one overflowing line.
# Block source: KMRP-ENGINE-FIXES.md (assembled with clang, verified with capstone).
[[hooks]]
address = 0x1001bc7ec
type = "replace"
original_bytes = [0x49, 0xFF, 0xC8, 0x4C, 0x8B, 0x65, 0xB0, 0x4D, 0x3B, 0x44, 0x24, 0x18, 0x0F, 0x84, 0xF8, 0x02, 0x00, 0x00]
replacement_bytes = [0x49, 0xFF, 0xC8, 0x4C, 0x8B, 0x65, 0xB0, 0x4D, 0x39, 0xF8, 0x77, 0x25, 0x4D, 0x89, 0xF8, 0x41, 0x0F, 0xB6, 0x00, 0x84, 0xC0, 0x74, 0x09, 0x3C, 0x0A, 0x74, 0x05, 0x49, 0xFF, 0xC0, 0xEB, 0xEF, 0x41, 0x88, 0xC5, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x69, 0xCA, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

# Two guards before the loop blank strings of one or two characters outright when
# the box is narrower than one or two 'o' glyphs, so enlarged stack counts vanish.
# Removing them is only safe together with the fix above (a box too narrow for one
# character used to hang; it now draws one overflowing line). A set: never alone.
#   0x1001bc71e  strlen == 1 and width < w('o')   : jmp return -> jmp to the loop
[[hooks]]
address = 0x1001bc71e
type = "simple"
original_bytes = [0xE9, 0xC4, 0x03, 0x00, 0x00]
replacement_bytes = [0xEB, 0x1E, 0x90, 0x90, 0x90]

#   0x1001bc738  strlen <= 2 and width < 2*w('o') : jl return -> fall through
[[hooks]]
address = 0x1001bc738
type = "simple"
original_bytes = [0x0F, 0x8C, 0xA9, 0x03, 0x00, 0x00]
replacement_bytes = [0x90, 0x90, 0x90, 0x90, 0x90, 0x90]

# ------------------------------------------------------------------------------
# K2. List rows grow on every repopulate - CSWGuiListBox::OrganizeControls (0x1004a82b4)
# ------------------------------------------------------------------------------
# The visible-row loop spreads the box's leftover height over the rows by making
# each row taller (rowHeight + leftover/rows, +1px on the remainder rows) and
# writes that height into the reused row controls. The next pass recomputes the
# list's item height (+0x368) as the max row height, reads the inflated value back
# and inflates again: lists grow each time they are refilled.
#
# Fix: keep the rect height at the item height stored before the loop ([rbp-0x34]);
# row positions still spread exactly as before (they advance by ebx, untouched).
#   0x1004a8927  mov [rbp-0x34], ebx   (rowHeight + extra)
[[hooks]]
address = 0x1004a8927
type = "simple"
original_bytes = [0x89, 0x5D, 0xCC]
replacement_bytes = [0x90, 0x90, 0x90]

#   0x1004a8939  mov [rbp-0x34], eax   (rowHeight + extra + 1, remainder rows)
[[hooks]]
address = 0x1004a8939
type = "simple"
original_bytes = [0x89, 0x45, 0xCC]
replacement_bytes = [0x90, 0x90, 0x90]

# ------------------------------------------------------------------------------
# K5. A line taller than its box vanishes - CAurGUIStringInternal::Draw (0x1001bcb04)
# ------------------------------------------------------------------------------
# When a text's lines do not fit its box, Draw drops lines from the top until the
# rest fits (bottom-aligned 0x20 and centred 0x10 alignment). A single line taller
# than its box is therefore dropped entirely and nothing is drawn: stack counts
# disappear as soon as the font outgrows the badge (FontScale, HD fonts, font mods).
# Fix: never drop the last line. Text that partly fits behaves exactly as before;
# text that cannot fit even one line is drawn overflowing instead of vanishing.
# [r13+0x50] = line count, r12 = lines dropped so far (first line to draw).
#   bottom-aligned entry: single line -> keep it (0x1001bcc2a), else drop loop
[[hooks]]
address = 0x1001bcbef
type = "replace"
original_bytes = [0x0F, 0x2E, 0xCA, 0x76, 0x36]
replacement_bytes = [0x0F, 0x2E, 0xCA, 0x76, 0x09, 0x41, 0x83, 0x7D, 0x50, 0x01, 0x7E, 0x02, 0xEB, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x2A, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   bottom-aligned loop: stop once only one line would remain
[[hooks]]
address = 0x1001bcc22
type = "replace"
original_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xCA, 0x77, 0xD1]
replacement_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xCA, 0x76, 0x19, 0x41, 0x8B, 0x4D, 0x50, 0xFF, 0xC9, 0x41, 0x39, 0xCC, 0x7D, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0xFB, 0xCB, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   centred entry: single line -> keep it (0x1001bccb1), else drop loop
[[hooks]]
address = 0x1001bcc72
type = "replace"
original_bytes = [0x0F, 0x2E, 0xD1, 0x76, 0x3A]
replacement_bytes = [0x0F, 0x2E, 0xD1, 0x76, 0x09, 0x41, 0x83, 0x7D, 0x50, 0x01, 0x7E, 0x02, 0xEB, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0xB1, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

#   centred loop: stop once only one line would remain
[[hooks]]
address = 0x1001bcca9
type = "replace"
original_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xD1, 0x77, 0xD1]
replacement_bytes = [0x49, 0xFF, 0xC4, 0x0F, 0x2E, 0xD1, 0x76, 0x19, 0x41, 0x8B, 0x4D, 0x50, 0xFF, 0xC9, 0x41, 0x39, 0xCC, 0x7D, 0x0E, 0xFF, 0x25, 0x00, 0x00, 0x00, 0x00, 0x82, 0xCC, 0x1B, 0x00, 0x01, 0x00, 0x00, 0x00]

# ------------------------------------------------------------------------------
# K6. Wrapped text measured too narrow - CAurGUIStringInternal::WrapStrings
# ------------------------------------------------------------------------------
# The line-breaker truncates every glyph advance to whole pixels after adding
# 0.25, so it under-measures a line by ~0.25px per character on average while
# Draw advances by the exact float widths: long lines can end up wider than the
# box they were wrapped for and run into the scrollbar. KMRP's Windows fix adds a
# 0.5px wrap margin (unbiased rounding); here the one accumulation in the loop is
# pointed at the engine's existing 0.5f (0x100537dc4) instead of 0.25f
# (0x10056eca0, shared by 42 other instructions, so the constant stays).
#   addss xmm0, [rip+disp] : 0x10056eca0 -> 0x100537dc4
[[hooks]]
address = 0x1001bca20
type = "simple"
original_bytes = [0xF3, 0x0F, 0x58, 0x05, 0x78, 0x22, 0x3B, 0x00]
replacement_bytes = [0xF3, 0x0F, 0x58, 0x05, 0x9C, 0xB3, 0x37, 0x00]



# ==============================================================================
# DETOURS - KEEP THESE LAST
# ==============================================================================
# KotorPatcher applies hooks in file order and stops at the first hook whose
# original_bytes do not match. The first DETOUR loads macos_x86_64.dylib, whose
# constructor (DylibInit) rewrites many of the byte hooks above with
# resolution-dependent values. Any byte hook listed after a detour would then
# fail verification and abort every hook behind it. With all byte hooks first
# and all detours last, KPM applies the declared baseline, then the constructor
# adjusts it.




# ==============================================================================
# 3. C++ DETOURS
# ==============================================================================

# Detour 1: CSWGuiMainInterface::Draw (0x100235e44)
# Master HUD render function called every frame during active gameplay.
# Dynamically anchors top-right buttons, bottom-right combat action bar,
# bottom-left portrait/vitality cluster, and aligns the minimap.
# Also dynamically enforces root viewport and scissor bounds so floating
# tooltips and button descriptions are never clipped at 1280px.
[[hooks]]
address = 0x100235e44
type = "detour"
function = "Hook_MainInterfaceDraw"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57, 0x41, 0x56, 0x41, 0x55, 0x41, 0x54]
[[hooks.parameters]]
source = "rdi"
type = "pointer"

# Detour 2: CSWGuiWindow::Draw (0x10049ded4)
# Master window render function called for all GUI windows (in-game menus,
# equip, inventory, character, abilities/skills, journal, map, options, dialogs, containers).
# Based on WindowsScaledKotor "Scaled Menu" (scaled-menu-v1):
# - Dynamically scales root menu panel, border (offset +0x70), and all child controls to fill
#   vertical screen height (uiHeight = screenHeight, uiWidth = screenHeight * 4 / 3, or MenuScale).
# - Configures bits 0x20 and 0x40 (0x60) on window + 0x5c, activating the engine's native 0x10049dd86 helper
#   to center the panel dynamically while maintaining 100% pixel-perfect mouse hitboxes in FindControlAtPoint.
[[hooks]]
address = 0x10049ded4
type = "detour"
function = "Hook_WindowDraw"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57, 0x41, 0x56, 0x41, 0x54, 0x53, 0x48, 0x83, 0xec, 0x20]
[[hooks.parameters]]
source = "rdi"
type = "pointer"

# Detour: CSWGuiClassSelection::Update (0x100337886)
# Scaled Class Menu (Character Generation)
# Fixes character model box distortion and overlapping in character generation
