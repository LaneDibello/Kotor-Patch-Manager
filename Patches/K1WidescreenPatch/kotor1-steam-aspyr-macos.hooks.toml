# ==============================================================================
# 6. STRUCTURAL ITEM ROW OPCODES (CONTAINER & WORKBENCH DYNAMIC ROW SCALING)
# ==============================================================================
# In vanilla KotOR, Container and Workbench item rows hardcode icon dimensions
# to 56px ($0x38). These structural opcode hooks modify the machine instructions
# so they read row height dynamically from the entry struct offset 0x14(%rbx).
#
# NOTE: All numerical row heights, strides, paddings, icon bounds, quantity badges,
# and text buttons for Inventory, Containers, Workbench, and Save/Load lists are
# dynamically calculated and injected at runtime by mac_PureCPP.dylib via
# refreshPatchedListConstants() and scaleMenuPanelTree().
# ==============================================================================

# --- Container / Store Item Entry SetExtent (0x1002bfb20) ---
# Replace hardcoded icon width/height 0x38 with dynamic 0x14(%rbx)
[[hooks]]
address = 0x1002bfb49
type = "simple"
original_bytes = [0x41, 0xbd, 0x38, 0x00, 0x00, 0x00] # movl $0x38, %r13d
replacement_bytes = [0x44, 0x8b, 0x6b, 0x14, 0x90, 0x90] # movl 0x14(%rbx), %r13d; nop; nop

# Quantity label horizontal position: pull closer to icon (use %r13d - 14)
[[hooks]]
address = 0x1002bfbbf
type = "simple"
original_bytes = [0xb8, 0x38, 0x00, 0x00, 0x00] # movl $0x38, %eax
replacement_bytes = [0x41, 0x8d, 0x45, 0xf2, 0x90] # leal -14(%r13), %eax; nop

# Text button start X: add %r13d (icon width) to %r15d (left)
[[hooks]]
address = 0x1002bfbe2
type = "simple"
original_bytes = [0x41, 0x83, 0xc7, 0x38] # addl $0x38, %r15d
replacement_bytes = [0x45, 0x01, 0xef, 0x90] # addl %r13d, %r15d; nop

# Text button width: subtract %r13d (icon width) from %eax (total width)
