# ==============================================================================
# 4. FORCE UNIFORM HUD GUI TEMPLATE (mipc212x9)
# ==============================================================================
# In CSWGuiMainInterface constructor (0x10023341b), vanilla KotOR checks height:
#   if height >= 1200, loads "mipc216x12" (1600x1200)
#   if height >= 1024, loads "mipc212x10" (1280x1024)
#   if height >= 960,  loads "mipc212x9"  (1280x960)
#   if height >= 768,  loads "mipc210x7"  (1024x768)
#   else loads "mipc28x6"
# By repointing the "mipc216x12" (0x100233429) and "mipc212x10" (0x10023345e) string
# pointers to "mipc212x9", the engine loads the same base 1280x960 layout on every
# resolution (1200p, 1080p, 1440p, 4K, Retina) without skipping any register initialization
# or jump instructions, guaranteeing 100% stability and zero crash on save loading.
[[hooks]]
address = 0x100233429
type = "simple"
original_bytes = [0x48, 0x8d, 0x35, 0x02, 0x78, 0x2f, 0x00]
replacement_bytes = [0x48, 0x8d, 0x35, 0x18, 0x78, 0x2f, 0x00]

