# ==============================================================================
# 4. C++ DETOUR: SCALED FLOATING TARGETS & MENU BACKDROP ALIGNMENT
# ==============================================================================
# Detour 3: CSWGuiControl::SetBounds (0x1004a17c2)
# Handles two critical engine scaling functions:
#
# A. SCALED FLOATING TARGETS (HEALTH BARS & ACTION ICONS)
# Intercepts SetBounds specifically to scale up the 3D Floating Target HUD elements:
# - Target nameplate (LBL_NAME / LBL_NAMEBG)
# - Target health bar (PB_HEALTH / LBL_HEALTHBG)
# - 3 action slot buttons (BTN_TARGET0..2), icons (LBL_TARGET0..2), and cycle arrows (BTN_TARGETUP/DOWN0..2)
# Based on WindowsScaledKotor "Scaled Floating Target + Actions" patch.
#
# B. MENU BACKDROP ASPECT ALIGNMENT & DOUBLE BEZEL ELIMINATION
# Intercepts the menu backdrop control from CSWGuiManager::DrawMenuBackdrop (0x10049f946).
# In vanilla 4:3, the backdrop texture ("800x600back") and menu frames overlap pixel-for-pixel.
# On widescreen, naively stretching the backdrop across the whole screen pushes its frame notches
# ~58px outward, creating a jarring "double bezel" behind the menu.
# Constraining the backdrop to the exact 4:3 scaled menu rectangle aligns them 1:1, completely
# eliminating the double bezel! Based on WindowsScaledKotor "ScaledMenuBorders".
[[hooks]]
address = 0x1004a17c2
type = "detour"
function = "UniversalSetBounds"
original_bytes = [0x55, 0x48, 0x89, 0xe5, 0x41, 0x57, 0x41, 0x56, 0x41, 0x54, 0x53, 0x48, 0x83, 0xec, 0x20]
[[hooks.parameters]]
source = "rdi"
type = "pointer"
[[hooks.parameters]]
source = "rsi"
type = "pointer"



# ==============================================================================
# 5. C++ DETOUR: SCALED FONTS (CAurFontInfo METADATA SCALING)
# ==============================================================================
# Detour 4: CResTexture::ParseTXI completion (0x1001f8883)
# Intercepts immediately after the texture TXI metadata parser finishes loading.
# On the Mac 64-bit Aspyr port, register R14 holds the live CResTexture pointer,
# and offset +0x48 holds the CAurFontInfo pointer (or nullptr for non-font textures).
# Scales the 5 font metrics:
#   - FontHeight (+0x04)
#   - BaselineHeight (+0x08)
#   - TextureWidth (+0x0C)
#   - SpacingR (+0x10)
#   - SpacingB (+0x14)
# Based on WindowsScaledKotor "Scaled Font" (font-scale-2x-v1) patch.
# Automatic scaling: (targetHeight / 1080.0f) with 1.0f floor, or configurable
# via FontScale in ~/Library/Application Support/Knights of the Old Republic/swkotor.ini.
[[hooks]]
address = 0x1001f8883
type = "detour"
function = "scaleLoadedTextureMetadata"
original_bytes = [0x48, 0x81, 0xc4, 0x20, 0x20, 0x00, 0x00, 0x5b, 0x41, 0x5c, 0x41, 0x5e, 0x41, 0x5f]
[[hooks.parameters]]
source = "r14"
type = "pointer"

# ==============================================================================
# 6. STRUCTURAL ITEM ROW OPCODES (CONTAINER & WORKBENCH DYNAMIC ROW SCALING)
# ==============================================================================
# In vanilla KotOR, Container and Workbench item rows hardcode icon dimensions
# to 56px ($0x38). These structural opcode hooks modify the machine instructions
# so they read row height dynamically from the entry struct offset 0x14(%rbx).
#
# NOTE: All numerical row heights, strides, paddings, icon bounds, quantity badges,
# and text buttons for Inventory, Containers, Workbench, and Save/Load lists are
# dynamically calculated and injected at runtime by mac_PureCPP.dylib via
# refreshPatchedListConstants() and scaleMenuPanelTree().
# ==============================================================================

# --- Container / Store Item Entry SetExtent (0x1002bfb20) ---
# Replace hardcoded icon width/height 0x38 with dynamic 0x14(%rbx)
[[hooks]]
address = 0x1002bfb49
type = "simple"
original_bytes = [0x41, 0xbd, 0x38, 0x00, 0x00, 0x00] # movl $0x38, %r13d
replacement_bytes = [0x44, 0x8b, 0x6b, 0x14, 0x90, 0x90] # movl 0x14(%rbx), %r13d; nop; nop

# Quantity label horizontal position: pull closer to icon (use %r13d - 14)
[[hooks]]
address = 0x1002bfbbf
type = "simple"
original_bytes = [0xb8, 0x38, 0x00, 0x00, 0x00] # movl $0x38, %eax
replacement_bytes = [0x41, 0x8d, 0x45, 0xf2, 0x90] # leal -14(%r13), %eax; nop

# Text button start X: add %r13d (icon width) to %r15d (left)
[[hooks]]
address = 0x1002bfbe2
type = "simple"
original_bytes = [0x41, 0x83, 0xc7, 0x38] # addl $0x38, %r15d
replacement_bytes = [0x45, 0x01, 0xef, 0x90] # addl %r13d, %r15d; nop

# Text button width: subtract %r13d (icon width) from %eax (total width)
[[hooks]]
address = 0x1002bfbe9
type = "simple"
original_bytes = [0x83, 0xc0, 0xc8] # addl $-0x38, %eax
replacement_bytes = [0x44, 0x29, 0xe8] # subl %r13d, %eax

