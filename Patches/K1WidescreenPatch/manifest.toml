[patch]
id = "k1widescreenpatch"
name = "Widescreen Patch (beta)"
version = "0.1.0"
description = "THIS PATCH REQUIRES THE STRAY-BUG-FIXES PATCH. Widescreen patch featuring HUD and menu scaling/realignment. Auto detects resolution (can be forced w/ .ini variables ForceWidth/ForceHeight). No .gui files required. Optional: if you use .gui files already laid out for your resolution (KOTOR High Resolution Menus, KMRP), add UseGuiFileLayouts=1 under [Graphics Options] in swkotor.ini."
author = "FTD, RaymanGT, J, Vriff"

requires = ["k1-stray-bug-fixes-patch"]

[patch.supported_versions]
kotor1_steam_aspyr_macos = "C1FCB8D37C702849882A17751C63EE0AF7C2B9CBBC3B31B98A5F0EDBC27C6D71"
