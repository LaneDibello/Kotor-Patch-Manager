# K1 Marked Empty Containers (Windows 1.03 Detour)
#
# CSWGuiTargetActionMenu::UpdateNameLabel (0x00685CB0) assembles the hovered
# object's name into a temporary CExoString at [esp+0x20] and, at 0x00685E69,
# calls CSWGuiTargetActionMenu::SetNameLabel (0x00685AF0) to display it.
#
# The 7-byte argument setup immediately before `call SetNameLabel` is:
#   0x00685E62: 8D 4C 24 20  lea ecx, [esp+0x20]
#   0x00685E66: 51           push ecx
#   0x00685E67: 8B CF        mov ecx, edi
#
# Whenever the temporary name string is non-empty, %ebx holds the hovered
# server object (CSWSObject*). MarkEmptyContainer runs first, appends
# " (empty)" to the temporary CExoString if the object is an empty container
# placeable, and then the stolen 7 bytes and `call SetNameLabel` run normally.

[metadata]
target_versions = [
    "9C10E0450A6EECA417E036E3CDE7474FED1F0A92AAB018446D156944DEA91435",
    "761F9466F456A83909036BAEBB5C43167D722387BE66E54617BA20A8C49E9886",
    "34E6D971C034222A417995D8E1E8FDD9F8781795C9C289BD86C499A439F34C88"
]

[[hooks]]
address = 0x00685E62
function = "MarkEmptyContainer"
type = "detour"
original_bytes = [ 0x8D, 0x4C, 0x24, 0x20, 0x51, 0x8B, 0xCF ]
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0x20" # Temporary CExoString holding the assembled hover name.
type = "pointer"

[[hooks.parameters]]
source = "ebx" # Hovered server object (CSWSObject*).
type = "pointer"
