# K1 Marked Empty Containers (macOS Aspyr 64-bit Detour)
#
# CSWGuiTargetActionMenu::UpdateNameLabel (0x100230CB4) assembles the hovered
# object's name into a temporary CExoString at -0x28(%rbp) and, at 0x100230E8E,
# calls CSWGuiTargetActionMenu::SetNameLabel (0x1002309C6) to display it.
#
# The 7-byte argument setup immediately before `callq SetNameLabel` is:
#   0x100230E87: 48 8D 75 D8  leaq -0x28(%rbp), %rsi
#   0x100230E8B: 4C 89 FF     movq %r15, %rdi
#
# Whenever the temporary name string is non-empty, %r14 holds the hovered
# server object (CSWSObject*). MarkEmptyContainer runs first, appends
# " (empty)" to the temporary CExoString if the object is an empty container
# placeable, and then the stolen 7 bytes and `callq SetNameLabel` run normally.

[metadata]
target_versions = [
    "C1FCB8D37C702849882A17751C63EE0AF7C2B9CBBC3B31B98A5F0EDBC27C6D71"
]

[[hooks]]
address = 0x100230E87
function = "MarkEmptyContainer"
type = "detour"
original_bytes = [ 0x48, 0x8D, 0x75, 0xD8, 0x4C, 0x89, 0xFF ]
exclude_from_restore = []

[[hooks.parameters]]
source = "rbp-0x28" # Temporary CExoString holding the assembled hover name.
type = "pointer"

[[hooks.parameters]]
source = "r14" # Hovered server object (CSWSObject*).
type = "pointer"
