# KOTOR 2 GOG Aspyr / swkotor2.exe
#
# Original behavior, roughly:
#   Buy confirmation threshold  = max(player_level * 50, 50)
#   Sell confirmation threshold = min(player_level * 50, 250)
#
# Patched behavior:
#   Buy confirmation threshold  = 2500
#   Sell confirmation threshold = 2500
#
# 2500 decimal = 0x000009C4 = C4 09 00 00 little-endian.
#
# Addresses are absolute virtual addresses, the same ones Ghidra shows. The engine
# dereferences them at runtime, so a raw file offset would land in __PAGEZERO and
# take the game down with it. For a hex editor on the fat binary, subtract
# 0x100000000 and add back the 0x1000 the x86_64 slice starts at.

# Sell path  
# The vanilla code creates a fallback (presetting the R14D register to 250).
# This modification changes that fallbak to 2500.
# MOV R14D, 0xfa at 0x10020693D; this edits the immediate's low two bytes.
[[hooks]]
address = 0x10020693F
type = "simple"
original_bytes = [0xfa, 0x00]
replacement_bytes = [0xc4, 0x09]

# And this modification forces the code to use that fallback.
# JA at 0x100206968, which becomes an unconditional JMP.
[[hooks]]
address = 0x100206968
type = "simple"
original_bytes = [0x77]
replacement_bytes = [0xEB]

# Buy path: 
# Same as the sell path's first step: changing fallback from 50 to 250.
# MOV R15D, 0x32 at 0x100207020; again the immediate's low two bytes.
[[hooks]]
address = 0x100207022
type = "simple"
original_bytes = [0x32, 0x00]
replacement_bytes = [0xc4, 0x09]

# And forcing the fallback (jumping the alternative calculation).
# JZ at 0x100207029, which becomes an unconditional JMP.
[[hooks]]
address = 0x100207029
type = "simple"
original_bytes = [0x74]
replacement_bytes = [0xeb]
