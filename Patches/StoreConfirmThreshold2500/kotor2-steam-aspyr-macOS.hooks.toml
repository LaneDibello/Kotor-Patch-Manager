# KOTOR 2 GOG Aspyr / swkotor2.exe
# Store expensive-item confirmation threshold patch.
#
# Original behavior:
#   Buy confirmation threshold  = player_level * 50, fallback 50
#   Sell confirmation threshold = min(player_level * 50, 250), fallback/cap 250
#
# Patched behavior:
#   Buy confirmation threshold  = 2500
#   Sell confirmation threshold = 2500
#
# 2500 decimal = 0x000009C4 = C4 09 00 00 little-endian.
# File offset for .text addresses in this executable: VA - 0x00400C00.
# Validated SHA-256: 777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914



# Sell path: Make the cap branch unconditional, so the capped-threshold block is used for all player levels.
# 100206968 is #207968
[[hooks]]
address = 0x207968
type = "simple"
original_bytes = [0x77, 0x1e]
replacement_bytes = [0xEB, 0x39]


# Sell path: change capped local threshold value from 250 to 2500.
# Changing fallback  from 250 to 2500
# 0x10020693d is 0x20793d
#NOTE: Could maybe target the number more accurately with 0x207941.
[[hooks]]
address = 0x20793d
type = "simple"
original_bytes = [0x41, 0xbe, 0xfa, 0x00, 0x00, 0x00]
replacement_bytes = [0x41, 0xbe, 0xc4, 0x09, 0x00, 0x00]


