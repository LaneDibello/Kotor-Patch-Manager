# Global::WinMain's frame loop, on the gate guarding the Sleep that sits in front of the
# game's own frame limiter. The hook has to land before that gate so the nap it writes is
# the one the Sleep reads.
#
# The cut is the gate's own compare, which is position independent. The call five bytes
# earlier would be the more obvious site, but a cut is re-executed from the wrapper
# without a relative fixup, so a CALL rel32 cannot be one.
[[hooks]]
address = 0x004048E8
function = "PaceFrame"
original_bytes = [0x39, 0x1D, 0x58, 0x3C, 0x7A, 0x00]
type = "detour"
exclude_from_restore = []
