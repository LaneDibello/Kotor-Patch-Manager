# AurPrintString(text, column, row) is a bare RET at 0x0837C9C4 here, the same empty
# function it is on Windows. The glyph table it used to draw from survived at 0x088CF3F4,
# byte-for-byte the 8x13 font the Windows build carries at 0x009F5508, so the module can
# rebuild the display lists from it.

[metadata]
target_versions = ["ED043D21A4578FD1C6F1557F0F72BDE5589BA3572A5B6F1A687ED9FEEAB49AC3"]

# The console prompt's cursor, drawn from the main loop at column consoleInputLength + 2.
# Clang writes cdecl arguments to [ESP+n] instead of pushing them, so all three land in
# the slots the Windows call site pushes them into.
[[hooks]]
address = 0x08199AA5
function = "DrawConsoleBitmapTextHook"
original_bytes = [0xE8, 0x1A, 0x2F, 0x1E, 0x00]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

[[hooks.parameters]]
source = "esp+4"
type = "int"

[[hooks.parameters]]
source = "esp+8"
type = "int"

