# PostedString::Post, which draws everything the console and the game post through
# AurPostString. There is no call left to take over. The stub is in the same translation
# unit, so the compiler inlined its empty body and the argument setup with it, and what
# it left behind is the colour save and restore that used to bracket the call: a round
# trip that loads the two saved-colour globals, spills them to stack slots nothing reads,
# and writes the same values straight back.
#
# The span below is that round trip. Taking all of it keeps the hook on instruction
# boundaries and leaves no half-executed remnant. Nothing branches into it, and execution
# resumes at 0x0837CCFE, which reloads XMM0 before using it.
#
# The object is live in ESI, so the hook reads the column and row from it.
[[hooks]]
address = 0x0837CCC6
function = "DrawPostedStringHook"
original_bytes = [
    0xF2, 0x0F, 0x10, 0x05, 0xAC, 0xC3, 0x93, 0x08,
    0xF2, 0x0F, 0x11, 0x44, 0x24, 0x20,
    0xF2, 0x0F, 0x10, 0x05, 0xA4, 0xC3, 0x93, 0x08,
    0xF2, 0x0F, 0x11, 0x44, 0x24, 0x18,
    0xF2, 0x0F, 0x10, 0x44, 0x24, 0x18,
    0xF2, 0x0F, 0x10, 0x4C, 0x24, 0x20,
    0xF2, 0x0F, 0x11, 0x0D, 0xAC, 0xC3, 0x93, 0x08,
    0xF2, 0x0F, 0x11, 0x05, 0xA4, 0xC3, 0x93, 0x08,
]
type = "detour"
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
