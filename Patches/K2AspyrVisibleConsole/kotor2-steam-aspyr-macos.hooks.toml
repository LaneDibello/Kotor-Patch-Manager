# The 8x13 glyph table AurPrintString drew from survived at 0x10053DC70, byte-for-byte the
# one the Windows and Linux builds carry.

[metadata]
target_versions = ["1C536C3EF2E8BED348B38934B381E3DC427F3EBEE21FADDFBD7524FBB2388D77"]

# The stub itself rather than its callers: Clang kept both calls here, so one hook covers
# the console cursor and the frame-rate readout. Skipping the frame it sets up and tears
# down leaves rsp and rbp untouched, so execution resumes on the RET at 0x1000A8664.
[[hooks]]
address = 0x1000A865F
function = "DrawPrintStringHook"
type = "detour"
original_bytes = [0x55, 0x48, 0x89, 0xE5, 0x5D]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "rdi"
type = "pointer"

[[hooks.parameters]]
source = "esi"
type = "int"

[[hooks.parameters]]
source = "edx"
type = "int"

# PostedString::Post, which draws everything the console and the game post through
# AurPostString. No call survives: the stub shares its translation unit, so the empty body
# and the argument setup were inlined away, leaving the colour save and restore that used
# to bracket the call. That round trip is the span below.
#
# Nothing branches into it and the LEA at 0x1000A88B8 redefines the RAX it leaves behind.
# Taking it whole keeps the RIP-relative LEA at its head out of the stub, which copies
# stolen bytes without relocating them. It sits after glColor4f so the text picks up the
# fade colour, and the object is still live in RBX across that call.
[[hooks]]
address = 0x1000A8893
function = "DrawPostedStringHook"
type = "detour"
original_bytes = [
    0x48, 0x8D, 0x05, 0x86, 0x6D, 0x52, 0x00,
    0x48, 0x8B, 0x08,
    0x48, 0x8B, 0x50, 0x08,
    0x48, 0x89, 0x55, 0xF0,
    0x48, 0x89, 0x4D, 0xE8,
    0x48, 0x8B, 0x4D, 0xE8,
    0x48, 0x8B, 0x55, 0xF0,
    0x48, 0x89, 0x50, 0x08,
    0x48, 0x89, 0x08,
]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "rbx"
type = "pointer"
