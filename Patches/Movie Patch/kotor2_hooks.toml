[metadata]
target_versions = [
    "777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914",
]

# Replace KotOR 2's final movie blit with Mitchell-Netravali filtering.
[[hooks]]
address = 0x00920AF1
type = "detour"
function = "blitMovieMitchellNetravaliKotor2"
original_bytes = [
    0x50,
    0x8B, 0x8D, 0x20, 0xFF, 0xFF, 0xFF,
    0x8B, 0x51, 0x48,
    0x83, 0xC2, 0x34,
    0x52,
    0x8B, 0x85, 0x20, 0xFF, 0xFF, 0xFF,
    0x8B, 0x48, 0x4C,
    0x51,
    0xFF, 0x15, 0xBC, 0x54, 0x98, 0x00
]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

[[hooks.parameters]]
source = "eax"
type = "uint"

# Release the movie OpenGL context before KotOR 2 destroys its movie window.
[[hooks]]
address = 0x0091FD10
type = "detour"
function = "releaseMovieFilterKotor2"
original_bytes = [
    0x55,
    0x8B, 0xEC,
    0x81, 0xEC, 0x84, 0x00, 0x00, 0x00
]
exclude_from_restore = []
