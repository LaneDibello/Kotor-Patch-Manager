# DLL-free read/write implementation. The author reports successful in-game testing on the original Steam 1.03 executable and the CD-crack 1.03 executable.
# GOG 1.03 compatibility was checked statically; in-game testing on that executable should be confirmed separately.
# Hook 1 resets the state word embedded at offset 0x9C in hook 2's replacement allocation.
# It decodes the installed JMP displacement at 0x00680086 to locate that allocation.
# Hook 2 uses VirtualProtect via this executable's IAT entry at 0x0073D084 to temporarily
# make its own allocation writable, updates the state, and restores the previous protection.

