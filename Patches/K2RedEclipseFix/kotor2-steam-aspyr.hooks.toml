# CVirtualMachine::RunScript, Steam build. The hook starts 6 bytes into the function so the entry at
# 0x006FD8D0 stays untouched. 0x006FD8D6: 89 4D F8 = MOV [EBP-8],ECX ; 83 7D 08 00 = CMP DWORD [EBP+8],0.
# That is 7 bytes of whole instructions.
[[hooks]]
address = 0x006FD8D6
type = "detour"
function = "RedEclipseRunScript"
original_bytes = [0x89, 0x4D, 0xF8, 0x83, 0x7D, 0x08, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "int"
