; Party Slots: the globals, for a mod's HoloPatcher / TSLPatcher changes.ini.
; Merge these into your own [2DAList] and sections. The four PS_SLOTS_ rows use
; ExclusiveColumn=name, so a row another mod already added is left alone.
; Replace MYMOD_PARTY_SLOT with your own global's name.
; Like any HoloPatcher mod, your tslpatchdata folder also needs an info.rtf beside
; changes.ini: without one, HoloPatcher's command line install waits forever.

[2DAList]
Table0=globalcat.2da

[globalcat.2da]
AddRow0=ps_slots_a
AddRow1=ps_slots_b
AddRow2=ps_slots_c
AddRow3=ps_slots_d
AddRow4=mymod_party_slot

[ps_slots_a]
ExclusiveColumn=name
name=PS_SLOTS_A
type=Number

[ps_slots_b]
ExclusiveColumn=name
name=PS_SLOTS_B
type=Number

[ps_slots_c]
ExclusiveColumn=name
name=PS_SLOTS_C
type=Number

[ps_slots_d]
ExclusiveColumn=name
name=PS_SLOTS_D
type=Number

[mymod_party_slot]
ExclusiveColumn=name
name=MYMOD_PARTY_SLOT
type=Number
