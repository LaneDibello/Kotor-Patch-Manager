# Filter activation messages during fullscreen restoration.
[[hooks]]
address = 0x00403C03
type = "detour"
function = "installActivationFilter"
original_bytes = [
    0xFF, 0xD6,
    0xA1, 0xFC, 0x39, 0x7A, 0x00
]
exclude_from_restore = []

# Restore fullscreen with a direct Win32 display-mode switch.
[[hooks]]
address = 0x00402A5B
type = "simple"
original_bytes = [
    0x8B, 0x0D, 0xF8, 0x39, 0x7A, 0x00,
    0x8B, 0x11,
    0xFF, 0x52, 0x1C
]
replacement_bytes = [
    0x90, 0x90, 0x90, 0x90, 0x90, 0x90,
    0x90, 0x90, 0x90, 0x90, 0x90
]

# Preserve the existing window and OpenGL context during activation.
[[hooks]]
address = 0x00402A66
type = "simple"
original_bytes = [
    0xC7, 0x05, 0x2C, 0x3A, 0x7A, 0x00,
    0x02, 0x00, 0x00, 0x00
]
replacement_bytes = [
    0x90, 0x90, 0x90, 0x90, 0x90,
    0x90, 0x90, 0x90, 0x90, 0x90
]

# Always resume rendering after activation.
[[hooks]]
address = 0x00402ACF
type = "simple"
original_bytes = [0x75, 0x05]
replacement_bytes = [0x90, 0x90]
