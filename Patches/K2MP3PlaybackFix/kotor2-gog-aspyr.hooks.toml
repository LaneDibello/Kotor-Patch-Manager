[metadata]
target_versions = ["777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914"]

# InitializeSource is at 0x0063BA40; its ResType_MP3 branch rewrites each candidate to
# Left(name, len - 3) + "wav" (0x00996BE8, used at 0x0063BB33 and 0x0063BC5B).
#
# The hook is the loop counter's initialiser: past the last rewrite, before the first
# fopen. The primary is at EBP-0xBC, and 16 alternates 8 bytes apart at EBP-0xAC.
[[hooks]]
address = 0x0063BD6B
function = "K2LooseMp3GogAspyr"
type = "detour"
original_bytes = [0xC7, 0x85, 0x38, 0xFF, 0xFF, 0xFF, 0x00, 0x00, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# The load of the RIFF size field, before the ADD that turns it into the audio offset.
# Reached only for a candidate opening with RIFF, so raw mp3 never pays for it.
# The field is at EBP-0xD8, the opened candidate's path at EBP-0x14.
[[hooks]]
address = 0x0063BED4
function = "K2Mp3RiffOffsetGogAspyr"
type = "detour"
original_bytes = [0x8B, 0x85, 0x28, 0xFF, 0xFF, 0xFF]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"
