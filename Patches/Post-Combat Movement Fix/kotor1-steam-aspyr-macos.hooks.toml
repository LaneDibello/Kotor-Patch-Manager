# Same cancellation state machine as the Windows build, in CClientExoAppInternal::ProcessInput
# (0x1002F8226). The two masked movement inputs are spilled to RBP-based locals before this call.
# Non-negative floats order the same as their bit patterns, so integer compares pick the max.
[metadata]
target_versions = ["C1FCB8D37C702849882A17751C63EE0AF7C2B9CBBC3B31B98A5F0EDBC27C6D71"]

[[hooks]]
address = 0x1002F9DB1
type = "replace"
original_bytes = [
    0x49, 0x8B, 0xBF, 0xE8, 0x03, 0x00, 0x00,
    0x48, 0x8B, 0x07,
    0xFF, 0x50, 0x38
]
replacement_bytes = [
    0x8B, 0x45, 0xBC,                   # mov eax, [rbp-44h] - raw forward/backward input
    0x25, 0xFF, 0xFF, 0xFF, 0x7F,       # and eax, 7FFFFFFFh - fabs
    0x8B, 0x4D, 0xD4,                   # mov ecx, [rbp-2Ch] - the opposite direction
    0x81, 0xE1, 0xFF, 0xFF, 0xFF, 0x7F, # and ecx, 7FFFFFFFh - fabs
    0x39, 0xC8,                         # cmp eax, ecx
    0x0F, 0x42, 0xC1,                   # cmovb eax, ecx - keep the larger magnitude
    0x66, 0x0F, 0x6E, 0xC0              # movd xmm0, eax - return it where the call did
]
