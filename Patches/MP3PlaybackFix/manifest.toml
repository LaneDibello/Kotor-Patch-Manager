[patch]
id = "mp3-playback-fix"
name = "MP3 Playback Fix"
version = "1.1.0"
author = "Synchro, FTD, Vriff, Lane"
description = "Ensures loose .mp3 audio files can be played in KOTOR2, and in KOTOR on macOS, prioritizing those files over same-named .wav files in the event of a conflict."

requires = []

# The id this patch shipped under while it covered KOTOR II alone.
conflicts = ["k2-mp3-playback-fix"]

