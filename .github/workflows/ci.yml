name: CI

on:
  push:
    branches: [master, ci-testing]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the cross and 32-bit toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-multilib \
            g++-mingw-w64-i686-posix

      - name: Build the managed projects
        run: dotnet build KotorPatchManager.Managed.slnf -c Release

      - name: Build the patcher engine
        run: make -C src/KotorPatcher all

      - name: Run the code generator tests
        run: make -C src/KotorPatcher test

      - name: Build the KProxy
        run: src/KProxy/build-mingw.sh "$RUNNER_TEMP/binkw32.dll"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Build KotorPatcher.dll
        run: msbuild src\KotorPatcher\KotorPatcher.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build the managed projects
        run: dotnet build KotorPatchManager.Managed.slnf -c Release
